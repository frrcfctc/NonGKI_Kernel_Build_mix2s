name: Build Kernel for Xiaomi Mi Note 3 (jason)

on:
  workflow_dispatch:

env:
  PROFILE_NAME: jason_crdroid.env

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Prepare Configuration
      run: |
        if [ -f "Profiles/${{ env.PROFILE_NAME }}" ]; then
          cat "Profiles/${{ env.PROFILE_NAME }}" >> $GITHUB_ENV
        else
          echo "Profile file not found: Profiles/${{ env.PROFILE_NAME }}"
          exit 1
        fi

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib libxml2-utils bzip2 libbz2-dev libbz2-1.0 libghc-bzlib-dev squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make optipng maven libssl-dev pwgen libswitch-perl policycoreutils minicom libxml-sax-base-perl libxml-simple-perl bc libc6-dev-i386 lib32ncurses-dev libx11-dev lib32z-dev libgl1-mesa-dev xsltproc unzip device-tree-compiler python3

    - name: Create workspace
      run: |
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Clone kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_BRANCH }} android-kernel --depth=1

    - name: Download Clang
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p clang
        git clone https://github.com/kdrag0n/proton-clang.git -b master clang --depth=1

    - name: Download GCC 64-bit
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc-64
        wget -O gcc-64.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc-64/ -zxvf gcc-64.tar.gz

    - name: Download GCC 32-bit
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        mkdir -p gcc-32
        wget -O gcc-32.tar.gz https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz
        tar -C gcc-32/ -zxvf gcc-32.tar.gz

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$PATH
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH
        make -j$(nproc) O=out ARCH=arm64 CC=clang \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          ${{ env.DEFCONFIG_NAME }} 2>&1 | tee build.log
        echo "=== Build log ==="
        cat build.log
        if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
          echo "ERROR: Image.gz-dtb not found!"
          exit 1
        fi

    - name: Package AnyKernel3
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone ${{ env.AK3_SOURCE }} -b ${{ env.AK3_BRANCH }} AnyKernel3
        cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cd AnyKernel3
        zip -r9 ../AnyKernel3.zip *

    - name: Upload AnyKernel3
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-jason-${{ github.run_number }}
        path: kernel_workspace/AnyKernel3.zip
